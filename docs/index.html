<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 포트폴리오 공시 대시보드</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#272c37;
    --text:#e6e9ef; --muted:#8b93a7; --accent:#4c8dff;
    --l3:#ff5c5c; --l2:#ffb020; --l1:#4c8dff; --l0:#6b7280;
    --new:#22c55e;
    --radius:10px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f2f4f7; --line:#e2e5ea;
      --text:#171a21; --muted:#697285; --l0:#9aa1ae;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.5;
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:1180px; margin:0 auto; padding:24px 18px 80px}

  header{display:flex; flex-wrap:wrap; align-items:baseline; gap:12px; margin-bottom:18px}
  h1{font-size:20px; margin:0; letter-spacing:-.3px}
  .sub{color:var(--muted); font-size:12.5px}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px}
  .kpi b{display:block; font-size:22px; letter-spacing:-.5px}
  .kpi span{color:var(--muted); font-size:12px}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:16px}
  .panel h2{font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.3px}

  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .row + .row{margin-top:9px}
  .lbl{color:var(--muted); font-size:12px; min-width:44px}

  .chip{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    border-radius:999px; padding:5px 11px; font-size:12.5px; cursor:pointer;
    transition:.12s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip .cnt{opacity:.6; font-size:11px; margin-left:4px}

  input[type=search], select{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit;
  }
  input[type=search]{flex:1; min-width:180px}
  input[type=search]:focus, select:focus{outline:none; border-color:var(--accent)}

  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:8px; padding:6px 11px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{color:var(--text); border-color:var(--accent)}

  .alert{
    background:linear-gradient(180deg,rgba(255,92,92,.10),transparent);
    border:1px solid rgba(255,92,92,.35);
  }
  .alert h2{color:var(--l3)}

  ul.list{list-style:none; margin:0; padding:0}
  li.item{
    display:flex; gap:11px; align-items:flex-start;
    padding:10px 4px; border-top:1px solid var(--line);
  }
  li.item:first-child{border-top:none}
  li.item.read{opacity:.42}

  .bar{width:3px; align-self:stretch; border-radius:2px; background:var(--l0); flex:none}
  .lv3 .bar{background:var(--l3)} .lv2 .bar{background:var(--l2)} .lv1 .bar{background:var(--l1)}

  .date{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; flex:none; width:78px; padding-top:1px}
  .body{flex:1; min-width:0}
  .title{display:block; font-size:13.8px; line-height:1.45}
  .title:hover{color:var(--accent); text-decoration:underline}
  .meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:4px; font-size:11.5px; color:var(--muted)}
  .tag{border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--panel2)}
  .tag.corp{color:var(--text); font-weight:600}
  .tag.cat{border-color:transparent; background:rgba(76,141,255,.14); color:var(--l1)}
  .lv3 .tag.cat{background:rgba(255,92,92,.15); color:var(--l3)}
  .lv2 .tag.cat{background:rgba(255,176,32,.15); color:var(--l2)}
  .tag.new{background:rgba(34,197,94,.16); color:var(--new); border-color:transparent; font-weight:600}
  .mark{
    flex:none; width:22px; height:22px; border-radius:6px; border:1px solid var(--line);
    background:var(--panel2); color:var(--muted); cursor:pointer; font-size:11px; line-height:1;
  }
  .mark:hover{border-color:var(--accent); color:var(--accent)}

  .grp{margin-top:14px}
  .grp h3{
    font-size:13px; margin:0 0 2px; padding:7px 4px; position:sticky; top:0;
    background:var(--panel); border-bottom:1px solid var(--line); z-index:2;
  }
  .grp h3 small{color:var(--muted); font-weight:400; margin-left:6px}

  .empty{color:var(--muted); text-align:center; padding:36px 0; font-size:13px}
  footer{color:var(--muted); font-size:11.5px; text-align:center; margin-top:26px; line-height:1.8}
  mark{background:rgba(255,176,32,.35); color:inherit; border-radius:2px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📋 포트폴리오 공시 대시보드</h1>
    <div class="sub" id="updated">불러오는 중…</div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="panel alert" id="alertPanel" hidden>
    <h2>⚠️ 최근 7일 중요 공시</h2>
    <ul class="list" id="alertList"></ul>
  </div>

  <div class="panel">
    <h2>필터</h2>
    <div class="row"><span class="lbl">종목</span><div class="row" id="fTicker"></div></div>
    <div class="row"><span class="lbl">분류</span><div class="row" id="fCat"></div></div>
    <div class="row">
      <span class="lbl">기간</span>
      <select id="fRange">
        <option value="7">최근 7일</option>
        <option value="30" selected>최근 30일</option>
        <option value="90">최근 90일</option>
        <option value="0">전체</option>
      </select>
      <select id="fLevel">
        <option value="0">중요도 전체</option>
        <option value="2">중요 이상만</option>
        <option value="3">매우 중요만</option>
      </select>
      <input type="search" id="fText" placeholder="공시 제목 검색…">
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="tView">🕘 시간순</button>
    <button class="btn" id="tUnread">읽지 않은 것만</button>
    <div class="spacer"></div>
    <span class="sub" id="count"></span>
    <button class="btn" id="bReadAll">모두 읽음</button>
    <button class="btn" id="bReset">필터 초기화</button>
  </div>

  <div class="panel"><div id="main"><div class="empty">불러오는 중…</div></div></div>

  <footer>
    데이터 출처: 금융감독원 전자공시시스템(DART) OpenAPI · 제목은 원문 링크로 연결됩니다<br>
    본 대시보드는 정보 제공용이며 투자 판단의 책임은 이용자 본인에게 있습니다
  </footer>
</div>

<script>
const LEVEL_NAME = {3:"매우 중요", 2:"중요", 1:"참고", 0:"일반"};
const STORE = "dart-dash-read";

let ITEMS = [], META = {};
let read = new Set(JSON.parse(localStorage.getItem(STORE) || "[]"));
const state = {
  tickers: new Set(), cats: new Set(),
  range: 30, level: 0, text: "",
  group: false, unreadOnly: false
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const saveRead = () => localStorage.setItem(STORE, JSON.stringify([...read]));

function daysAgoStr(n){
  const d = new Date(Date.now() + 9*3600e3);       // KST 기준
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0,10);
}

async function boot(){
  try{
    const bust = "?v=" + Date.now();
    const [d, m] = await Promise.all([
      fetch("data/disclosures.json" + bust).then(r => r.json()),
      fetch("data/meta.json" + bust).then(r => r.json()).catch(() => ({}))
    ]);
    ITEMS = d.items || [];
    META = m || {};
  }catch(e){
    $("#main").innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.<br>' +
      'GitHub Actions에서 <code>Update DART disclosures</code> 워크플로를 한 번 실행했는지 확인하세요.</div>';
    $("#updated").textContent = "데이터 없음";
    return;
  }
  $("#updated").textContent = META.updated_at_display
    ? `마지막 갱신 ${META.updated_at_display}` : "";
  buildFilters();
  buildKpis();
  buildAlerts();
  render();
}

function buildKpis(){
  const d7 = daysAgoStr(7), d30 = daysAgoStr(30);
  const k = [
    ["전체 공시", ITEMS.length],
    ["최근 7일", ITEMS.filter(i => i.date >= d7).length],
    ["최근 30일", ITEMS.filter(i => i.date >= d30).length],
    ["중요 이상 (7일)", ITEMS.filter(i => i.date >= d7 && i.level >= 2).length],
    ["안 읽음", ITEMS.filter(i => !read.has(i.rcept_no)).length],
    ["추적 종목", (META.holdings || []).length]
  ];
  $("#kpis").innerHTML = k.map(([l,v]) => `<div class="kpi"><b>${v.toLocaleString()}</b><span>${l}</span></div>`).join("");
}

function buildFilters(){
  const byTicker = new Map();
  ITEMS.forEach(i => byTicker.set(i.ticker, (byTicker.get(i.ticker)||0)+1));
  const holdings = (META.holdings || []).length
    ? META.holdings
    : [...byTicker.keys()].map(t => ({ticker:t, label:t}));

  $("#fTicker").innerHTML = holdings.map(h =>
    `<button class="chip" data-t="${h.ticker}">${esc(h.label || h.ticker)}<span class="cnt">${byTicker.get(h.ticker)||0}</span></button>`
  ).join("");

  const byCat = new Map();
  ITEMS.forEach(i => byCat.set(i.category, (byCat.get(i.category)||0)+1));
  const cats = [...byCat.entries()].sort((a,b) => b[1]-a[1]);
  $("#fCat").innerHTML = cats.map(([c,n]) =>
    `<button class="chip" data-c="${esc(c)}">${esc(c)}<span class="cnt">${n}</span></button>`
  ).join("");

  $("#fTicker").onclick = e => toggleChip(e, state.tickers, "t");
  $("#fCat").onclick    = e => toggleChip(e, state.cats,    "c");
}

function toggleChip(e, set, attr){
  const b = e.target.closest(".chip"); if(!b) return;
  const v = b.dataset[attr];
  set.has(v) ? set.delete(v) : set.add(v);
  b.classList.toggle("on");
  render();
}

function buildAlerts(){
  const d7 = daysAgoStr(7);
  const hot = ITEMS.filter(i => i.date >= d7 && i.level >= 3).slice(0, 12);
  if(!hot.length) return;
  $("#alertPanel").hidden = false;
  $("#alertList").innerHTML = hot.map(row).join("");
}

function row(i){
  const cls = `item lv${i.level}${read.has(i.rcept_no) ? " read" : ""}`;
  const q = state.text.trim();
  let title = esc(i.title);
  if(q) title = title.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi"), "<mark>$1</mark>");
  return `<li class="${cls}" data-id="${i.rcept_no}">
    <div class="bar"></div>
    <div class="date">${i.date.slice(2)}</div>
    <div class="body">
      <a class="title" href="${i.url}" target="_blank" rel="noopener">${title}</a>
      <div class="meta">
        <span class="tag corp">${esc(i.name)}</span>
        <span class="tag cat">${esc(i.category)}</span>
        ${i.level >= 2 ? `<span class="tag">${LEVEL_NAME[i.level]}</span>` : ""}
        ${i.is_new ? `<span class="tag new">NEW</span>` : ""}
        ${i.market ? `<span class="tag">${esc(i.market)}</span>` : ""}
        ${i.filer && i.filer !== i.name ? `<span>제출: ${esc(i.filer)}</span>` : ""}
        ${i.remark ? `<span>${esc(i.remark)}</span>` : ""}
      </div>
    </div>
    <button class="mark" title="읽음 표시">${read.has(i.rcept_no) ? "↺" : "✓"}</button>
  </li>`;
}

function filtered(){
  const cut = state.range ? daysAgoStr(state.range) : "";
  const q = state.text.trim().toLowerCase();
  return ITEMS.filter(i =>
    (!cut || i.date >= cut) &&
    (!state.tickers.size || state.tickers.has(i.ticker)) &&
    (!state.cats.size    || state.cats.has(i.category)) &&
    i.level >= state.level &&
    (!state.unreadOnly || !read.has(i.rcept_no)) &&
    (!q || i.title.toLowerCase().includes(q) || i.name.toLowerCase().includes(q))
  );
}

function render(){
  const list = filtered();
  $("#count").textContent = `${list.length.toLocaleString()}건`;

  if(!list.length){
    $("#main").innerHTML = '<div class="empty">조건에 맞는 공시가 없습니다.</div>';
    return;
  }

  if(!state.group){
    $("#main").innerHTML = `<ul class="list">${list.map(row).join("")}</ul>`;
  }else{
    const groups = new Map();
    list.forEach(i => (groups.get(i.name) || groups.set(i.name, []).get(i.name)).push(i));
    const order = [...groups.entries()].sort((a,b) => {
      const ma = Math.max(...a[1].map(x => x.level)), mb = Math.max(...b[1].map(x => x.level));
      return mb - ma || b[1].length - a[1].length;
    });
    $("#main").innerHTML = order.map(([name, rows]) =>
      `<div class="grp"><h3>${esc(name)}<small>${rows.length}건</small></h3>
       <ul class="list">${rows.map(row).join("")}</ul></div>`
    ).join("");
  }

  $("#main").querySelectorAll(".mark").forEach(b => b.onclick = onMark);
  $("#alertList")?.querySelectorAll(".mark").forEach(b => b.onclick = onMark);
}

function onMark(e){
  const id = e.target.closest(".item").dataset.id;
  read.has(id) ? read.delete(id) : read.add(id);
  saveRead(); buildKpis(); buildAlerts(); render();
}

/* --- 컨트롤 바인딩 --- */
$("#fRange").onchange = e => { state.range = +e.target.value; render(); };
$("#fLevel").onchange = e => { state.level = +e.target.value; render(); };
let t; $("#fText").oninput = e => { clearTimeout(t); t = setTimeout(() => { state.text = e.target.value; render(); }, 180); };

$("#tView").onclick = e => {
  state.group = !state.group;
  e.target.textContent = state.group ? "🏷 종목별" : "🕘 시간순";
  render();
};
$("#tUnread").onclick = e => {
  state.unreadOnly = !state.unreadOnly;
  e.target.style.color = state.unreadOnly ? "var(--accent)" : "";
  render();
};
$("#bReadAll").onclick = () => {
  filtered().forEach(i => read.add(i.rcept_no));
  saveRead(); buildKpis(); buildAlerts(); render();
};
$("#bReset").onclick = () => {
  state.tickers.clear(); state.cats.clear();
  state.range = 30; state.level = 0; state.text = ""; state.unreadOnly = false;
  document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
  $("#fRange").value = "30"; $("#fLevel").value = "0"; $("#fText").value = "";
  $("#tUnread").style.color = "";
  render();
};

boot();
</script>
</body>
</html>
